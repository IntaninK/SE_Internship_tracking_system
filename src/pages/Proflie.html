<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ระบบติดตามการเตรียมฝึกงานของนิสิต SE</title>
    <link rel="stylesheet" href="profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>

    <!-- Header Bar -->
  <div id="header-placeholder"></div>


    <!-- Main Content -->
    <main class="main-content">
        <div class="card">
            <!-- Card Header -->
            <div class="card-header">
                <span class="material-icons header-icon">how_to_reg</span>
                <h2 class="card-title">ข้อมูลส่วนตัวนิสิต (Student Personal Data)</h2>
            </div>

            <!-- Card Body -->
            <div class="card-body">
                <!-- Top Section: Photo + Info Fields -->
                <div class="info-section-top">
                    <div class="profile-photo">
                        <img src="https://via.placeholder.com/236x236?text=Profile" alt="Profile Photo">
                    </div>

                    <div class="info-fields">
                        <!-- Row 1 -->
                        <div class="field-row">
                            <div class="field-group field-large">
                                <label class="field-label">ชื่อ-สกุล (ไทย)</label>
                                <div class="field-input">
                                    <span class="field-value">นาย ทอง หลังอิ่ม</span>
                                </div>
                            </div>
                            <div class="field-group field-small">
                                <label class="field-label">รหัสนิสิต</label>
                                <div class="field-input">
                                    <span class="field-value">670xxxxx</span>
                                </div>
                            </div>
                        </div>

                        <!-- Row 2 -->
                        <div class="field-row">
                            <div class="field-group field-large">
                                <label class="field-label">Name & Surname (English)</label>
                                <div class="field-input">
                                    <span class="field-value">Thong Lang-im</span>
                                </div>
                            </div>
                            <div class="field-group field-small">
                                <label class="field-label">ชั้นปีที่</label>
                                <div class="field-input">
                                    <span class="field-value">3</span>
                                </div>
                            </div>
                        </div>

                        <!-- Row 3 -->
                        <div class="field-row">
                            <div class="field-group field-large">
                                <label class="field-label">เกรดเฉลี่ย</label>
                                <div class="field-input">
                                    <span class="field-value">3.67</span>
                                </div>
                            </div>
                            <div class="field-group field-small">
                                <label class="field-label">สาขาวิชา</label>
                                <div class="field-input">
                                    <span class="field-value">วิศวกรรมซอฟต์แวร์</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bottom Section: Contact Info -->
                <div class="info-section-bottom">
                    <!-- Row 1 -->
                    <div class="field-row">
                        <div class="field-group field-half">
                            <label class="field-label">E-mail</label>
                            <div class="field-input">
                                <span class="field-value">...</span>
                            </div>
                        </div>
                        <div class="field-group field-half">
                            <label class="field-label">เบอร์โทร</label>
                            <div class="field-input">
                                <span class="field-value">...</span>
                            </div>
                        </div>
                    </div>

                    <!-- Row 2 -->
                    <div class="field-row">
                        <div class="field-group field-half">
                            <label class="field-label">Line ID</label>
                            <div class="field-input">
                                <span class="field-value">...</span>
                            </div>
                        </div>
                        <div class="field-group field-half">
                            <label class="field-label">Line ID</label>
                            <div class="field-input">
                                <span class="field-value">...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Button -->
        <div class="edit-button-wrapper">
            <button class="btn-edit">
                <span class="material-icons">add_circle</span>
                <span>ดู/แก้ไขข้อมูล</span>
            </button>
        </div>
    </main>

    <script src="../components/header.js"></script>

</body>
</html>
