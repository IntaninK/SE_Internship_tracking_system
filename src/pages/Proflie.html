<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ระบบติดตามการเตรียมฝึกงานของนิสิต SE</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="../css/main-output.css">
</head>
<body>

    <!-- Header Bar -->
  <div id="header-placeholder"></div>


    <!-- Main Content -->
    <main class="main-content">
        <section class="card">
            <div class="card-header">
                <span class="material-icons header-icon">person</span>
                <h2 class="card-title">ข้อมูลส่วนตัวนิสิต (Student Personal Data)</h2>
            </div>
            <div class="card-body">  
                <div class="flex flex-wrap gap-[32px_50px] mb-10 max-[900px]:flex-col max-[900px]:items-center">
                    <div class="w-[260px] min-w-[180px] max-w-[260px] h-[336px] rounded-[15px] border border-black overflow-hidden flex items-center justify-center bg-[#f0f0f0] shrink mx-auto max-[560px]:w-full max-[560px]:max-w-[240px] max-[560px]:h-[300px] max-[360px]:max-w-[200px] max-[360px]:h-[250px]" style="flex-basis: 260px;">
                        <img id="p-photo" src="" alt="Profile Photo" class="w-full h-full object-cover" style="display: none;">
                        <span id="p-icon" class="material-icons text-[100px] text-gray-400">person</span>
                    </div>

                    <div class="flex-1 min-w-[280px] flex flex-col gap-5 max-[900px]:w-full max-[900px]:min-w-0" style="flex: 1 1 320px;">
                        <!-- Row 1 -->
                        <div class="flex flex-wrap gap-[16px_24px] max-[560px]:flex-col max-[560px]:gap-4">
                            <div class="flex flex-col gap-[10px] min-w-[140px] max-[560px]:min-w-0 max-[560px]:w-full" style="flex: 1.33 1 200px;">
                                <label class="text-[20px] font-semibold text-[#323639] leading-[1.35]">ชื่อ-สกุล (ไทย)</label>
                                <input class="input-field text-[18px] font-medium" id="p-nameTh" readonly />
                            </div>
                            <div class="flex flex-col gap-[10px] min-w-[140px] max-[560px]:min-w-0 max-[560px]:w-full" style="flex: 1 1 140px;">
                                <label class="text-[20px] font-semibold text-[#323639] leading-[1.35]">รหัสนิสิต</label>
                                <input class="input-field text-[18px] font-medium" id="p-studentCode" readonly />
                            </div>
                        </div>

                        <!-- Row 2 -->
                        <div class="flex flex-wrap gap-[16px_24px] max-[560px]:flex-col max-[560px]:gap-4">
                            <div class="flex flex-col gap-[10px] min-w-[140px] max-[560px]:min-w-0 max-[560px]:w-full" style="flex: 1.33 1 200px;">
                                <label class="text-[20px] font-semibold text-[#323639] leading-[1.35]">Name & Surname (English)</label>
                                <input class="input-field text-[18px] font-medium" id="p-nameEn" readonly />
                            </div>
                            <div class="flex flex-col gap-[10px] min-w-[140px] max-[560px]:min-w-0 max-[560px]:w-full" style="flex: 1 1 140px;">
                                <label class="text-[20px] font-semibold text-[#323639] leading-[1.35]">ชั้นปีที่</label>
                                <input class="input-field text-[18px] font-medium" id="p-year" readonly />
                            </div>
                        </div>

                        <!-- Row 3 -->
                        <div class="flex flex-wrap gap-[16px_24px] max-[560px]:flex-col max-[560px]:gap-4">
                        <div class="flex flex-col gap-[10px] min-w-[140px] max-[560px]:min-w-0 max-[560px]:w-full" style="flex: 1.33 1 200px;">
                            <label class="text-[20px] font-semibold text-[#323639] leading-[1.35]">อาจารย์ที่ปรึกษา</label>
                            <input class="input-field text-[18px] font-medium" id="p-advisor" readonly />
                        </div>
                        <div class="flex flex-col gap-[10px] min-w-[140px] max-[360px]:min-w-0 max-[560px]:w-full" style="flex: 1.33 1 200px;">

                            <label class="text-[20px] font-semibold text-[#323639] leading-[1.35]">สาขาวิชา</label>
                            <input class="input-field text-[18px] font-medium" id="p-major" readonly />
                        </div>
                        <div class="flex flex-col gap-[10px] min-w-[140px] max-[360px]:min-w-0 max-[560px]:w-full" style="flex: 1 1 140px;">
                            <label class="text-[20px] font-semibold text-[#323639] leading-[1.35]">เกรดเฉลี่ย</label>
                            <input class="input-field text-[18px] font-medium" id="p-gpa" readonly />                            
                        </div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-[10px]">
                    <div class="flex flex-wrap gap-[16px_24px] max-[560px]:flex-col max-[560px]:gap-4">
                        <div class="flex flex-col gap-[10px] min-w-[140px] max-[560px]:min-w-0 max-[560px]:w-full" style="flex: 1 1 160px;">
                            <label class="text-[20px] font-semibold text-[#323639] leading-[1.35]">E-mail</label>
                            <input class="input-field text-[18px] font-medium" id="p-email" readonly />
                        </div>
                        <div class="flex flex-col gap-[10px] min-w-[140px] max-[560px]:min-w-0 max-[560px]:w-full" style="flex: 1 1 160px;">
                            <label class="text-[20px] font-semibold  text-[#323639] leading-[1.35]">เบอร์โทร</label>
                            <input class="input-field text-[18px] font-medium" id="p-phone" readonly />
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-[16px_24px] max-[560px]:flex-col max-[560px]:gap-4">
                        <div class="flex flex-col gap-[10px] min-w-[140px] max-[560px]:min-w-0 max-[560px]:w-full" style="flex: 1 1 160px;">
                            <label class="text-[20px] font-semibold text-[#323639] leading-[1.35]">Line ID</label>
                            <input class="input-field text-[18px] font-medium" id="p-lineId" readonly />
                        </div>
                        <div class="flex flex-col gap-[10px] min-w-[140px] max-[560px]:min-w-0 max-[560px]:w-full" style="flex: 1 1 160px;">
                            <label class="text-[20px] font-semibold text-[#323639] leading-[1.35]">Facebook</label>
                            <input class="input-field text-[18px] font-medium" id="p-facebook" readonly />
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Edit Button -->
        <div class="flex justify-end mt-6 max-[560px]:justify-center">
            <a href="/pages/status_all.html" class="btn btn-primary btn-lg max-[560px]:w-full max-[560px]:justify-center no-underline inline-flex items-center gap-2">
                <span class="material-icons">edit</span>
                <span>ดู/แก้ไขข้อมูล</span>
            </a>
        </div>
    </main>

    <script src="../components/header.js"></script>
    <script src="../api/profile_view.js"></script>
</body>
</html>
