<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - อาจารย์ที่ปรึกษา</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main-output.css">
  <style>
    body {
      font-family: 'Prompt', 'Inter', sans-serif;
      background-color: #f0f7ff;
    }
  </style>
</head>
<body class="bg-[#f0f7ff] min-h-screen text-gray-800">

  <!-- Header Bar -->
  <div id="header-placeholder"></div>

  <!-- ========== Main Content ========== -->
  <main class="main-content max-w-[1300px] mx-auto py-6 px-4 space-y-6">

    <!-- ===== Card 1: สถานะ Checklist ของนิสิต ===== -->
    <div class="card bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="card-header bg-gradient-to-r from-blue-900 to-blue-700 text-white px-6 py-4 flex items-center gap-3">
        <span class="material-icons header-icon text-2xl">checklist</span>
        <h2 class="card-title text-xl font-bold">สถานะ Checklist ของนิสิต</h2>
      </div>
      <div class="card-body p-6">
        <div class="flex flex-col lg:flex-row gap-8 items-center justify-around">

          <!-- Donut Chart 1: Checklist Status -->
          <div id="chart-checklist" class="w-full lg:w-1/2 flex items-center justify-center min-h-[140px]">
            <span class="text-gray-400 text-sm">กำลังโหลดข้อมูล Checklist...</span>
          </div>

          <!-- Divider on large screen -->
          <div class="hidden lg:block w-px h-36 bg-gray-200"></div>

          <!-- Donut Chart 2: Readiness Status -->
          <div id="chart-readiness" class="w-full lg:w-1/2 flex items-center justify-center min-h-[140px]">
            <span class="text-gray-400 text-sm">กำลังโหลดข้อมูลความพร้อม...</span>
          </div>

        </div>
      </div>
    </div>

    <!-- ===== Card 2: รายชื่อนิสิต ที่ปรึกษา ===== -->
    <div class="card">
      <div class="card-header">
        <span class="material-icons header-icon">how_to_reg</span>
        <h2 class="card-title">รายชื่อนิสิต ที่ปรึกษา</h2>
      </div>
      <div class="card-body">
        <!-- Controls -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-4">
          <h3 class="text-base font-semibold text-gray-800">
            รายชื่อนิสิต
            <span id="active-filter-badge" class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full ml-1" style="display:none;"></span>
            <button onclick="clearFilter()" id="btn-clear-filter" class="text-xs text-blue-500 ml-2 hover:underline" style="font-weight:normal; display:none;">[ล้างตัวกรอง]</button>
          </h3>
          <div class="flex items-center gap-2 flex-wrap">
            <div class="relative">
              <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">search</span>
              <input type="text" placeholder="Search item..." id="student-search" class="input-field !pl-10 !w-[180px]" />
            </div>
            <button class="btn btn-primary btn-sm" onclick="openSetStatusModal()">
              <span class="material-icons text-sm">settings</span> ตั้งสถานะนิสิต
            </button>
          </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto">
          <table class="data-table text-[13px]">
            <thead>
              <tr>
                <th>Student ID</th>
                <th>ชื่อ-นามสกุล</th>
                <th>อาจารย์ที่ปรึกษา</th>
                <th>สถานะ</th>
                <th style="width:80px;"></th>
              </tr>
            </thead>
            <tbody id="students-tbody">
              <tr><td colspan="5" class="text-center py-8 text-gray-400">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination & Export -->
        <div class="flex flex-col sm:flex-row items-center justify-between mt-4 gap-3">
          <span class="text-sm text-gray-500" id="pagination-info">-</span>
          <div class="flex items-center gap-1" id="pagination-controls"></div>
          <button class="btn btn-tonal btn-sm" onclick="exportStudents()">
            <span class="material-icons text-sm">download</span> export
          </button>
        </div>

      </div>
    </div>

  </main><!-- /main-content -->

  <!-- Modal: ตั้งสถานะนิสิต (Batch) -->
  <div id="modal-set-status" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <span class="material-icons text-blue-600">settings</span> ตั้งสถานะ Checklist นิสิต
        </h3>
        <button onclick="closeSetStatusModal()" class="text-gray-400 hover:text-gray-600 border-none bg-transparent cursor-pointer">
          <span class="material-icons">close</span>
        </button>
      </div>

      <p class="text-sm text-gray-600">
        นิสิตที่เลือก: <strong id="modal-selected-count" class="text-blue-600 font-bold">0</strong> คน
      </p>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">เลือกสถานะ Checklist</label>
        <select id="batch-status-select" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:border-blue-500">
          <option value="APPROVED">✓ อาจารย์รีวิวแล้ว (ผ่าน)</option>
          <option value="PENDING">☐ รอผล</option>
          <option value="REJECTED">✗ ไม่ผ่าน / ทำ checklist เพิ่ม</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">หมายเหตุ / คอมเมนต์ (ถ้ามี)</label>
        <textarea id="batch-status-note" rows="3" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="ใส่ข้อความหมายเหตุ..."></textarea>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button onclick="closeSetStatusModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-xl cursor-pointer border-none">
          ยกเลิก
        </button>
        <button onclick="submitBatchStatus()" class="px-5 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium cursor-pointer border-none shadow">
          บันทึกสถานะ
        </button>
      </div>
    </div>
  </div>

  <script src="../components/header.js"></script>
  <script src="../api/advisor_dashboard.js"></script>
</body>
</html>
